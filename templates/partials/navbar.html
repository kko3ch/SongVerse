<style>
  .navbar-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    position: relative;
  }
  .brand { display: flex; align-items: center; gap: 0.5rem; font-size: 1.1rem; flex-shrink: 0; }

  .nav-collapse {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex: 1;
    margin-left: 2rem;
    gap: 1.5rem;
  }
  .nav-links { display: flex; gap: 1.5rem; align-items: center; }
  .nav-links a { color: var(--text-dim); font-weight: 500; font-size: 0.95rem; }
  .nav-links a:hover { color: var(--text); }
  .letter-pill {
    width: 34px; height: 34px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    color: var(--accent);
    font-size: 0.9rem;
    flex-shrink: 0;
  }
  .navbar-actions { display: flex; align-items: center; gap: 0.75rem; }
  .logout-form button {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 0.4rem 0.9rem;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .logout-form button:hover { border-color: var(--text-dim); color: var(--text); }

  /* Hidden on desktop — this is the mobile menu button */
  .nav-toggle {
    display: none;
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 1.15rem;
    padding: 0.35rem 0.65rem;
    border-radius: 8px;
    cursor: pointer;
    line-height: 1;
  }

  /* ---------- Mobile: collapse into a dropdown behind a hamburger ---------- */
  @media (max-width: 640px) {
    .nav-toggle { display: block; }

    .nav-collapse {
      display: none;
      position: absolute;
      top: calc(100% + 0.75rem);
      left: 0;
      right: 0;
      margin-left: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      flex-direction: column;
      align-items: stretch;
      gap: 1rem;
      z-index: 200;
    }
    .nav-collapse.open { display: flex; }

    .nav-links {
      flex-direction: column;
      align-items: flex-start;
      gap: 0.85rem;
    }
    .letter-pill { align-self: flex-start; }

    .navbar-actions {
      flex-direction: column;
      align-items: stretch;
      gap: 0.6rem;
      width: 100%;
    }
    .navbar-actions .btn,
    .navbar-actions > a,
    .logout-form,
    .logout-form button {
      width: 100%;
      text-align: center;
    }
  }
</style>

<nav>
  <div class="navbar-inner">
    <a href="{% url 'core:home' %}" class="brand">🎵 SongVerse</a>

    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">☰</button>

    <div class="nav-collapse" id="navCollapse">
      <div class="nav-links">
        <a href="{% url 'core:home' %}">Home</a>
        <a href="{% url 'challenge:today' %}">Today's Challenge</a>
        <a href="{% url 'leaderboard:leaderboard' %}">Leaderboard</a>
        <span class="letter-pill" title="Today's letter">{{ today_letter }}</span>
      </div>
      <div class="navbar-actions">
        {% if user.is_authenticated %}
          <a href="{% url 'songs:submit' %}" class="btn">Submit</a>
          <a href="{% url 'accounts:profile' user.username %}">{{ user.username }}</a>
          <form action="{% url 'accounts:logout' %}" method="post" class="logout-form">
            {% csrf_token %}
            <button type="submit">Logout</button>
          </form>
        {% else %}
          <a href="{% url 'accounts:login' %}">Log in</a>
          <a href="{% url 'accounts:signup' %}" class="btn">Sign up</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>

<script>
  (function () {
    const toggle = document.getElementById("navToggle");
    const collapse = document.getElementById("navCollapse");
    if (!toggle || !collapse) return;

    toggle.addEventListener("click", () => {
      const isOpen = collapse.classList.toggle("open");
      toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
    });

    // Close the menu automatically once a link inside it is tapped —
    // otherwise it stays open after navigating to the new page.
    collapse.querySelectorAll("a, button").forEach((el) => {
      el.addEventListener("click", () => {
        collapse.classList.remove("open");
        toggle.setAttribute("aria-expanded", "false");
      });
    });
  })();
</script>
